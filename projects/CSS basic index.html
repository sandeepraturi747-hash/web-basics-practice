<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basic</title>

    <style>
        #box1:visited{
          color: hsl(198, 89%, 39%);  
        }

        #box2{
            color: hsl(92, 92%, 34%);
        }

        #box3{
            font-size: 1.2em;
        }

        #box4{
           width: 105px;
           height: 36px;
           background-color: hsl(55, 96%, 61%); 
           border-radius: 30px;
           
        }


         #box5{
           margin-left: 15px;
           width: 105px;
           height: 36px;
           background-color: hsl(36, 96%, 61%); 
           border-radius: 30px;
        }

        #box4:active{
            opacity: 100;
        }

        #box5:active{
            opacity: 100;
        }


    </style>

</head>
<body>

    <a  id="box1"    href="https://www.amazon.in" target="_blank" title="Visit Website">Back to Amazon</a>
    
     <h2>Nike Black Running shoes</h2>

     <p id="box2">$39 - In Stock</p>

     <p id="box3">Free delivery tomorrow</p>

     <button id="box4">Buy Now</button>
     <button id="box5">Add to Cart</button>


</body>
</html>
