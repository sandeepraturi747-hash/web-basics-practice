<body>
    <!--cobinators used to highlight p under containers div their are 4 types of div
    1- = descendant 2- >=child 3- ~= general sibling 4- +=adajcent siblink-->


    <div id="containers">
        <!--This is child-->
        <p>This is H1</p>
        <p>This is H1</p>
       <!--thi is descendant-->
        <div>
            <p>This is H4</p>
        </div>
    
    </div>

    
        <!--this is also sibling but if we remove div tag it wont be a sibling-->
        <p>This is H4</p>
        <p>This is H4</p>
